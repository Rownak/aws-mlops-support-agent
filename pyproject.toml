# uv workspace root.
#
# This file is NOT an installable package any more — it declares the workspace,
# the shared dev dependencies, and the tooling config that covers every member.
# The real packages live under packages/:
#   - rag-core                  the corpus-agnostic RAG engine
#   - aws-mlops-support-agent   this project (AWS docs corpus + support agent)
[project]
name = "aws-mlops-workspace"
version = "0.1.0"
requires-python = ">=3.13, <4.0"
# The root itself ships no code; it depends on the members so that a plain
# `uv sync` installs both packages (editable) into the one shared .venv.
dependencies = [
    "rag-core",
    "aws-mlops-support-agent",
    "rag-bench-eval",
]

[tool.uv.workspace]
members = ["packages/*"]

# Resolve all names to the local workspace members rather than PyPI.
[tool.uv.sources]
rag-core = { workspace = true }
aws-mlops-support-agent = { workspace = true }
rag-bench-eval = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
# Both packages' test directories, collected by one `uv run pytest` from the root.
testpaths = [
    "packages/rag_core/tests",
    "packages/aws_mlops_support_agent/tests",
    "packages/rag_bench_eval/tests",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F = pycodestyle/pyflakes basics, I = import sorting,
# UP = modern-python upgrades, B = common bug patterns (bugbear)
select = ["E", "F", "I", "UP", "B"]
