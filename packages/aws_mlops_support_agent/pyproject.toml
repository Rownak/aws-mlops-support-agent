# This project: the AWS CodeBuild/CodePipeline corpus plus the support agent
# (LangGraph state machine, Jira escalation, Streamlit demo) built on rag-core.
[project]
name = "aws-mlops-support-agent"
version = "0.1.0"
description = "Agentic RAG support assistant for AWS CI/CD docs, with Jira escalation."
requires-python = ">=3.13, <4.0"
dependencies = [
    "rag-core",
    "langgraph>=1.2.7",
    "streamlit>=1.58.0",
    "requests>=2.34.2",
    "grandalf>=0.8",
]

[project.scripts]
aws-agent = "aws_mlops_support_agent.app:main"
aws-agent-ingest = "aws_mlops_support_agent.ingest:main"
aws-agent-evals = "aws_mlops_support_agent.evals.run:main"
aws-agent-demo = "aws_mlops_support_agent.demo.launch:main"

# rag-core comes from the workspace, not PyPI.
[tool.uv.sources]
rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_mlops_support_agent"]
