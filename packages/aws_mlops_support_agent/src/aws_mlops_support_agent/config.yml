# Corpus + index + model settings for THIS project (design.md §5).
#
# Non-secret and committed on purpose: it makes the corpus reproducible and
# diffable. Secrets (OPENAI_API_KEY, PINECONE_API_KEY, the Jira credentials)
# come only from the environment and never appear here.
#
# Schema is rag_core's generic config (see packages/rag_core/config.example.yaml).
# `type: awsdocs_git` is this project's own source type, registered with
# rag_core's REGISTRY by aws_mlops_support_agent.sources — it clones each
# archived AWS user guide, recovers the pre-archival markdown from git
# history, and tags every chunk with its canonical docs URL. rag_core itself
# still knows nothing about git.
embeddings:
  provider: openai
  model: text-embedding-3-small

llm:
  provider: openai
  model: gpt-4o-mini

vectorstore:
  provider: pinecone
  # The live Pinecone index. 
  collection_name: aws-support-agent-idx
  cloud: aws
  region: us-east-1

splitter:
  chunk_size: 800
  chunk_overlap: 100
  strategy: markdown

retriever:
  search_type: similarity
  top_k: 4
  # Stale: eyeballed against an older embedding model, whose on-corpus top-1
  # scores ran ~0.4-0.6. The current model's scores run much higher and
  # overlap heavily between on- and off-corpus questions (on-corpus
  # 0.709-0.869, off-corpus 0.689-0.781 in evals/results.md) — this threshold
  # is not well-calibrated for today's model and needs its own investigation,
  # not a quick number swap. Left as-is for now; see evals/results.md.
  min_top_score: 0.35

sources:
  # `path` is where clones live; each guide lands in <path>/<id>/doc_source.
  - type: awsdocs_git
    id: codebuild
    path: data/aws_docs
    git_url: https://github.com/awsdocs/aws-codebuild-user-guide.git
    docs_base_url: https://docs.aws.amazon.com/codebuild/latest/userguide/
  # - type: awsdocs_git
  #   id: codepipeline
  #   path: data/aws_docs
  #   git_url: https://github.com/awsdocs/aws-codepipeline-user-guide.git
  #   docs_base_url: https://docs.aws.amazon.com/codepipeline/latest/userguide/
