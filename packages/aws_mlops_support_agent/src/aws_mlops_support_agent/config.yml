# Corpus + index + model settings for THIS project (design.md §5).
#
# Non-secret and committed on purpose: it makes the corpus reproducible and
# diffable. Secrets (OPENAI_API_KEY, PINECONE_API_KEY, the Jira credentials)
# come only from the environment and never appear here.
#
# Schema is rag_core's generic config (see packages/rag_core/config.example.yaml).
# rag_core knows nothing about git or awsdocs: the `sources` below are plain
# `type: local` folders, plus an `id` key rag_core ignores (SourceSpec is a
# passthrough dict) but aws_mlops_support_agent.sources.fetch reads to know
# which repo populates that path. A separate fetch step
# (aws_mlops_support_agent-specific, not rag_core) clones each awsdocs repo,
# recovers the pre-archival markdown, and writes it to these paths before
# ingestion runs.
embeddings:
  provider: openai
  model: text-embedding-3-small

llm:
  provider: openai
  model: gpt-4o-mini

vectorstore:
  provider: pinecone
  # The live Pinecone index. Committed here so a fresh clone with no .env
  # still points at the right corpus; PINECONE_INDEX_NAME can override it
  # (e.g. to build a staging index) without editing this file.
  collection_name: aws-support-agent-idx
  cloud: aws
  region: us-east-1

splitter:
  chunk_size: 800
  chunk_overlap: 100
  strategy: markdown

retriever:
  search_type: similarity
  top_k: 4
  # Eyeballed on this corpus with text-embedding-3-small: on-corpus questions
  # score ~0.4-0.6 top-1. See evals/results.md for the known weakness — some
  # off-corpus questions also clear this bar.
  min_top_score: 0.35

sources:
  - type: local
    id: codebuild
    path: data/aws_docs/codebuild/doc_source
    extensions: [".md"]
  - type: local
    id: codepipeline
    path: data/aws_docs/codepipeline/doc_source
    extensions: [".md"]
