# rag_bench_eval config (design_summary.md §Config). One file: embedding/LLM/
# reranker resources by name, retrieval pipelines by name, the sweep list, and
# the evaluation metrics. Pipeline nodes nest inline — no cross-references.

embeddings:
  default:
    provider: ollama
    model: nomic-embed-text
    base_url: "http://localhost:11434"

rerankers:
  bi_encoder:
    provider: bi_encoder
    embeddings: default
  cross_encoder:
    provider: cross_encoder
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    device: cuda  # falls back to cpu automatically if CUDA isn't available

retrieval:
  active: production
  pipelines:
    bm25:
      type: bm25
      k1: 0.9
      b: 0.4
      top_k: 10
    dense:
      type: dense
      embeddings: default
      metric: cosine
      top_k: 10
    hybrid:
      type: rrf
      rrf_k: 60
      top_k: 10
      retrievers:
        - {type: bm25, k1: 0.9, b: 0.4, top_k: 10}
        - {type: dense, embeddings: default, metric: cosine, top_k: 10}
    bi_encoder_rerank:
      type: rerank
      reranker: bi_encoder
      candidate_k: 50
      top_k: 10
      inner: {type: dense, embeddings: default, metric: cosine, top_k: 10}
    hybrid_cross_encoder:
      type: rerank
      reranker: cross_encoder
      candidate_k: 50
      top_k: 10
      inner:
        type: rrf
        rrf_k: 60
        top_k: 50
        retrievers:
          - {type: bm25, k1: 0.9, b: 0.4, top_k: 50}
          - {type: dense, embeddings: default, metric: cosine, top_k: 50}

sweep: [bm25, dense, hybrid, bi_encoder_rerank, hybrid_cross_encoder]

evaluation:
  metrics: [ndcg@10, recall@100, mrr@10, precision@10]
  primary: ndcg@10
