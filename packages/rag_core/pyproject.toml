# The generic RAG engine. Deliberately depends on NO agent framework, NO web UI
# and NO Jira client — installing this alone must stay lightweight, which is the
# whole point of the workspace split (design.md §1, requirement 2).
[project]
name = "rag-core"
version = "0.1.0"
description = "Corpus-agnostic retrieval-augmented-generation engine."
requires-python = ">=3.13, <4.0"
dependencies = [
    "langchain>=1.3.11",
    "langchain-text-splitters>=1.1.2",
    "langsmith>=0.9",
    "langchain-pinecone>=0.2.13",
    "pinecone>=5.0",
    "markitdown[pdf]>=0.0.1a3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    # Chunk sizes are counted in tokens, not characters — the unit that
    # actually constrains the embedding model. Declared explicitly because
    # the splitters need it whether or not an OpenAI extra is installed.
    "tiktoken>=0.8",
    # Lexical (BM25) retrieval — pure-Python, no extra system deps.
    "rank-bm25>=0.2",
    # Cosine similarity over the dense index matrix.
    "numpy>=1.26",
]

[project.optional-dependencies]
# Local-dev LLM/embeddings via Ollama.
ollama = ["langchain-ollama>=0.3"]
# Cloud LLM/embeddings via OpenAI.
openai = ["langchain-openai>=1.3.3"]
# Cloud LLM/embeddings via Google Gemini.
google = ["langchain-google-genai>=2.0"]
# S3 document source.
s3 = ["boto3>=1.34"]
# Local cross-encoder reranking.
rerank = ["sentence-transformers>=3.0"]
# Hosted Cohere reranking.
cohere = ["cohere>=5.0"]
# Hybrid (dense + sparse) retrieval.
hybrid = ["fastembed>=0.3"]

[project.scripts]
# Generic single-question CLI; any project points it at its own config.yaml.
rag-ask = "rag_core.generation.ask:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]
