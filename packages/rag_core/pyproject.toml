# The generic RAG engine. Deliberately depends on NO agent framework, NO web UI
# and NO Jira client — installing this alone must stay lightweight, which is the
# whole point of the workspace split (design.md §1, requirement 2).
[project]
name = "rag-core"
version = "0.1.0"
description = "Corpus-agnostic retrieval-augmented-generation engine."
requires-python = ">=3.13, <4.0"
dependencies = [
    "langchain>=1.3.11",
    "langchain-openai>=1.3.3",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.2",
    "langsmith>=0.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
]

[project.scripts]
# Generic single-question CLI; any project points it at its own config.yml.
rag-ask = "rag_core.generation.ask:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]
